name: Publish signed Android app
on:
  push:
    branches: [main]
    paths: ['android/release/signature.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate reviewed build reference
        id: build
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const patch=JSON.parse(fs.readFileSync('android/release/signature.json','utf8'));
          const {version}=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(patch.baseCommit)||patch.baseRelease!=='android-build-'+patch.baseCommit)throw Error('Invalid source build');
          if(!/^\d+\.\d+\.\d+$/.test(patch.version)||patch.version!==version)throw Error('Signature version does not match app version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=${patch.baseRelease}\ncommit=${patch.baseCommit}\nversion=${version}\n`);
          JS
      - name: Download exact unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.build.outputs.tag }}
        run: gh release download "$BUILD_TAG" --dir android-build
      - run: node scripts/apply-android-signature.mjs android-build/app-release-unsigned.apk shike-v${{ steps.build.outputs.version }}.apk
      - name: Verify Android signature and the original upgrade certificate
        env:
          APP_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          java -jar android-build/apksigner.jar verify --verbose --print-certs "shike-v${APP_VERSION}.apk" | tee signature-check.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected=fs.readFileSync('android/signing-certificate.sha256','utf8').trim();
          const actual=fs.readFileSync('signature-check.txt','utf8').match(/Signer #1 certificate SHA-256 digest: ([a-f0-9]+)/)?.[1];
          if(actual!==expected)throw Error('APK certificate differs from the original release');
          JS
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.build.outputs.version }}
        run: |
          sha256sum "shike-v${APP_VERSION}.apk" > "shike-v${APP_VERSION}.sha256"
          # Tag the publication commit; the signed manifest pins the exact tested APK source.
          gh release create "v${APP_VERSION}" "shike-v${APP_VERSION}.apk" "shike-v${APP_VERSION}.sha256" --target "$GITHUB_SHA" --title "拾课 v${APP_VERSION} · 手机与平板适配" --notes-file android/RELEASE.md
