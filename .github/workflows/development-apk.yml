name: Publish verified Android development APK
on:
  push:
    branches: [feature/android-v2-timetable]
    paths:
      - '.github/workflows/development-apk.yml'
      - 'release-development/signature-v2.0.0.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: shike-development-apk-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '40703962136'
      BUILD_COMMIT: '63ebc466720c459fc1122be8908aef56e54a64d8'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve only the tested unsigned build
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}" > build-run.json
          gh api "repos/${GITHUB_REPOSITORY}/compare/${BUILD_COMMIT}...${GITHUB_SHA}" > publication-diff.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const run=JSON.parse(fs.readFileSync('build-run.json','utf8'));
          if(run.head_sha!==process.env.BUILD_COMMIT || run.conclusion!=='success')throw Error('Build was not successfully tested');
          const diff=JSON.parse(fs.readFileSync('publication-diff.json','utf8'));
          const allowed=new Set(['.github/workflows/development-apk.yml','release-development/signature-v2.0.0.json']);
          if(diff.status!=='ahead' || !Array.isArray(diff.files) || diff.files.length>2 || diff.files.some(file=>!allowed.has(file.filename)))throw Error('Publication commit changes the tested app');
          JS
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name android-unsigned-review --dir reviewed-build
      - name: Reconstruct the locally signed APK and verify its exact bytes
        run: |
          set -euo pipefail
          mkdir -p development-release
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {applySignature} from './scripts/apply-android-signature.mjs';
          const patch=JSON.parse(fs.readFileSync('release-development/signature-v2.0.0.json','utf8'));
          const certificate=fs.readFileSync('android/signing-certificate.sha256','utf8').trim();
          if(patch.baseCommit!==process.env.BUILD_COMMIT || patch.version!=='2.0.0' || patch.certificateSHA256!==certificate)throw Error('Signature provenance mismatch');
          const apk=applySignature(fs.readFileSync('reviewed-build/app-release-unsigned.apk'),patch);
          const hash=createHash('sha256').update(apk).digest('hex');
          if(apk.length!==patch.bytes || hash!==patch.signedSHA256)throw Error('Signed APK mismatch');
          fs.writeFileSync('development-release/shike-v2.0.0-dev.3.apk',apk);
          fs.writeFileSync('development-release/shike-v2.0.0-dev.3.sha256',hash+'  shike-v2.0.0-dev.3.apk\n');
          JS
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs development-release/shike-v2.0.0-dev.3.apk > signature-check.txt
          expected="$(tr -d '\r\n' < android/signing-certificate.sha256)"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" signature-check.txt
      - name: Publish a development prerelease without updating stable
        run: |
          set -euo pipefail
          cat > development-notes.md <<'NOTES'
          拾课 v2.0.0 开发版 3，新增每节课时长及上午、下午、晚上节数设置，完善课程编辑和删除，优化截图识别与草稿存储。

          下载 shike-v2.0.0-dev.3.apk。沿用原包名和原签名，Android 内部版本 2.0.0 / 202，可覆盖旧开发版。请先分别导出任务和课程表备份，再覆盖安装，不要卸载。

          在“管理课表 → 修改名称、学期与作息”设置课长和分时段节数；支持某时段 0 节，每天总计 1–20 节。修改上课时间自动填写下课时间，每节仍可单独调整。调整上午节数时会更新下午、晚上课程的节次编号；仍有课程使用被减少的节次时拒绝保存，防止排错课。

          点周课表中的课程可修改或删除，也可通过顶部“管理课程”查找所有周及待补全课程。同门课名称/教师可同步；删除前选择仅一条上课安排或整门课全部安排，对应调课和提醒同步移除。“已完成”按钮移至“全部待办”页面上方。

          完全相同的图片复用本次草稿结果；单元格和数字按完整像素摘要短时复用，保留原数字复核。草稿进度与文字更新不再重复写入所有截图，旧草稿可恢复并原子迁移。七张原图依旧识别为 11 门课程、34 条安排；79 次重复识别被复用，重复文件不再识别。速度取决于设备，电脑测试耗时不代表手机实测。

          逻辑 56 项通过；完整界面回归 66 项通过、1 项旧截图样本缺失跳过；Android 14/15 模拟器各 22 项测试通过。包含分组作息持久化、课长生效、节次调整保护、课程编辑/删除、旧草稿图片迁移和原有任务流程。ColorOS 真机后台提醒仍需设备验收。

          已验证应用源码：63ebc466720c459fc1122be8908aef56e54a64d8；测试运行：https://github.com/xieyonghuan/student-task-assistant/actions/runs/40703962136 。发布标签仅增加公开签名和发布配置；应用代码一致性、APK 摘要及证书均在发布前校验。稳定版和网页保持现状，不接入教务系统。
          NOTES
          gh release create v2.0.0-dev.3 development-release/shike-v2.0.0-dev.3.apk development-release/shike-v2.0.0-dev.3.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title '拾课 v2.0.0 开发版 3' --notes-file development-notes.md
