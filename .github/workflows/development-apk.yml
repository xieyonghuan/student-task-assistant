name: Publish verified Android development APK
on:
  push:
    branches: [feature/android-v2-timetable]
    paths:
      - '.github/workflows/development-apk.yml'
      - 'release-development/signature-v2.0.0.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: shike-development-apk-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '40645884051'
      BUILD_COMMIT: '4bff1db3f0579974a42f4a4f2533258e92966d28'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve only the tested unsigned build
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}" > build-run.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const run=JSON.parse(fs.readFileSync('build-run.json','utf8'));
          if(run.head_sha!==process.env.BUILD_COMMIT || run.conclusion!=='success')throw Error('Build was not successfully tested');
          JS
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name android-unsigned-review --dir reviewed-build
      - name: Reconstruct the locally signed APK and verify its exact bytes
        run: |
          set -euo pipefail
          mkdir -p development-release
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {applySignature} from './scripts/apply-android-signature.mjs';
          const patch=JSON.parse(fs.readFileSync('release-development/signature-v2.0.0.json','utf8'));
          const certificate=fs.readFileSync('android/signing-certificate.sha256','utf8').trim();
          if(patch.baseCommit!==process.env.BUILD_COMMIT || patch.version!=='2.0.0' || patch.certificateSHA256!==certificate)throw Error('Signature provenance mismatch');
          const apk=applySignature(fs.readFileSync('reviewed-build/app-release-unsigned.apk'),patch);
          const hash=createHash('sha256').update(apk).digest('hex');
          if(apk.length!==patch.bytes || hash!==patch.signedSHA256)throw Error('Signed APK mismatch');
          fs.writeFileSync('development-release/shike-v2.0.0-dev.1.apk',apk);
          fs.writeFileSync('development-release/shike-v2.0.0-dev.1.sha256',hash+'  shike-v2.0.0-dev.1.apk\n');
          JS
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs development-release/shike-v2.0.0-dev.1.apk > signature-check.txt
          expected="$(tr -d '\r\n' < android/signing-certificate.sha256)"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" signature-check.txt
      - name: Publish a development prerelease without updating stable
        run: |
          set -euo pipefail
          cat > development-notes.md <<'NOTES'
          拾课 v2.0.0 开发版 1，新增本地课程表与课程列表截图 OCR、多图确认去重、识别草稿恢复、多份课表、手动录入、调课和上课提醒。

          下载 shike-v2.0.0-dev.1.apk。沿用原签名，先在首页设置中导出任务备份，再覆盖安装，不要先卸载。Android 内部版本为 2.0.0 / 200。

          课程表先填写第一教学周星期一和实际作息；预填作息只是示例。截图识别需人工核对星期、节次和周次，待补全课程不提醒。开启上课提醒后按需允许通知和准确提醒，默认提前 10 分钟。

          Android 14/15 模拟器各 20 项测试通过，逻辑 51 项及界面 59 项通过；ColorOS 真机和实际学校课表截图仍需验收。本版不连接教务系统。

          已验证源码：4bff1db3f0579974a42f4a4f2533258e92966d28；测试运行：https://github.com/xieyonghuan/student-task-assistant/actions/runs/40645884051 。稳定版和网页不更新。
          NOTES
          gh release create v2.0.0-dev.1 development-release/shike-v2.0.0-dev.1.apk development-release/shike-v2.0.0-dev.1.sha256 --repo "$GITHUB_REPOSITORY" --target "$BUILD_COMMIT" --prerelease --latest=false --title '拾课 v2.0.0 开发版 1' --notes-file development-notes.md
